# Model Router — configuração de modelos (tiers → modelos + providers).
#
# Este arquivo é o FALLBACK usado quando ~/.polvo/config.yml não existe.
# A config real vive em ~/.polvo/config.yml (gerenciada pelo `polvo` CLI).
# Edite aqui apenas se quiser um default de repo; o CLI sobrescreve via wizard.

# Providers disponíveis. Cada provider tem um base_url (endpoint OpenAI-compatível)
# e o nome da env var que guarda a chave daquele provider.
providers:
  default:
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
  # Provider local (Ollama rodando na máquina) — usado pelo classificador leve.
  # O Ollama local ignora o header Authorization, então a chave é irrelevante.
  local:
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY

# Tiers adaptativos (eixo fixo: mini/air/pro/ultra). O classificador só escolhe
# entre estes. Cada um aponta para um provider acima.
adaptive:
  mini:
    model: gemma4:31b
    provider: default
    name: mini
  air:
    model: deepseek-v4-flash:0731
    provider: default
    name: air
  pro:
    model: deepseek-v4-pro:0813
    provider: default
    name: pro
  ultra:
    model: kimi-k3
    provider: default
    name: ultra

# Modelos custom (opcional): roteáveis por id explícito, nunca escolhidos pelo
# classificador.
custom: {}

# Classificador.
# - model: modelo usado na decisão qualitativa (JSON). É o decisor PRIMÁRIO.
# - provider: qual provider serve o classificador (default: "default").
# - min_classify_len: prompts menores que isso = chatter trivial (mini).
classifier:
  model: gemma4:31b
  provider: default
  min_classify_len: 10
